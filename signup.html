<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create Student Account | Tibyan Medresa</title>
<style>
body{font-family:Arial;background:#F7F0E4;color:#4A2C20;padding:20px}
main{max-width:420px;margin:30px auto;background:#fffdf8;padding:25px;border-radius:12px}
label{display:block;margin-top:15px;font-weight:bold}
input{width:100%;padding:12px;margin-top:6px;box-sizing:border-box;border:1px solid #c9b89d;border-radius:6px}
button{width:100%;padding:13px;margin-top:20px;background:#C49A45;border:0;border-radius:6px;font-weight:bold}
</style>
</head>
<body>
<main>
<h1>Tibyan Medresa</h1>
<h3>Create Student Account</h3>
<form id="signup">
<label>Email</label>
<input id="email" type="email" required>
<label>Password (at least 6 characters)</label>
<input id="password" type="password" minlength="6" required>
<button id="submit">Create account</button>
<p id="message" role="status"></p>
<p><a href="login.html">Already have an account? Log in</a></p>
</form>
</main>
<script>
const SUPABASE_URL="https://vldyuegaoptahhlsldor.supabase.co";
const SUPABASE_KEY="sb_publishable_3NKxWzGph0mviWRGENEPYw_puAh7dxj";

document.getElementById("signup").addEventListener("submit",async function(e){
 e.preventDefault();
 const message=document.getElementById("message");
 const button=document.getElementById("submit");
 button.disabled=true;
 message.textContent="Creating account...";
 try{
  const response=await fetch(SUPABASE_URL+"/auth/v1/signup",{
   method:"POST",
   headers:{"apikey":SUPABASE_KEY,"Content-Type":"application/json"},
   body:JSON.stringify({
    email:document.getElementById("email").value.trim(),
    password:document.getElementById("password").value,
    options:{emailRedirectTo:window.location.origin+"/login.html"}
   })
  });
  const data=await response.json();
  if(!response.ok) throw new Error(data.msg||data.message||data.error_description||"Could not create account.");
  message.textContent=data.session
   ?"Account created! You can now log in."
   :"Account created. Check your email to confirm it, then log in.";
 }catch(error){
  message.textContent=error.message||"Please try again.";
 }finally{
  button.disabled=false;
 }
});
</script>
</body>
</html>
