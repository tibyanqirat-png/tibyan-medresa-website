<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Login | Tibyan Medresa</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#F7F0E4;
  color:#4A2C20;
  padding:20px;
}
main{
  max-width:420px;
  margin:35px auto;
  background:#fffdf8;
  padding:28px;
  border-radius:14px;
  border:1px solid #e4d4b9;
  box-shadow:0 8px 25px rgba(74,44,32,.08);
}
.logo{
  width:110px;
  height:110px;
  margin:0 auto 15px;
  border:2px dashed #C49A45;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#8a7049;
  font-size:14px;
  overflow:hidden;
}
.logo img{
  width:100%;
  height:100%;
  object-fit:contain;
}
h1{text-align:center;margin:0;color:#4A2C20}
.subtitle{text-align:center;color:#78675a;margin:8px 0 24px}
h3{margin-bottom:8px}
label{display:block;margin-top:16px;font-weight:bold}
input{
  width:100%;
  padding:12px;
  margin-top:7px;
  border:1px solid #c9b89d;
  border-radius:6px;
  font-size:16px;
}
button{
  width:100%;
  padding:13px;
  margin-top:22px;
  background:#C49A45;
  color:#302013;
  border:0;
  border-radius:6px;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
}
button:disabled{opacity:.6;cursor:wait}
a{color:#765038}
#message{line-height:1.5;overflow-wrap:anywhere}
</style>
</head>

<body>
<main>
  <div class="logo">
    <!-- Replace the placeholder with your logo URL later:
    <img src="YOUR_LOGO_URL" alt="Tibyan Medresa Logo">
    -->
    Tibyan Logo
  </div>

  <h1>Tibyan Medresa</h1>
  <p class="subtitle">Welcome back to your learning journey</p>

  <h3>Student Login</h3>

  <form id="login">
    <label for="student_code">Student Code</label>
    <input
      id="student_code"
      type="text"
      placeholder="e.g. M001 or F001"
      autocomplete="username"
      required
    >

    <label for="password">Password</label>
    <input
      id="password"
      type="password"
      autocomplete="current-password"
      required
      minlength="4"
    >

    <button id="submit" type="submit">Log in</button>
    <p id="message" role="status"></p>

    <p>New student? <a href="register.html">Register here</a></p>
  </form>
</main>

<script>
const SUPABASE_URL = "https://vldyuegaoptahhlsldor.supabase.co";
const SUPABASE_KEY = "sb_publishable_3NKxWzGph0mviWRGENEPYw_puAh7dxj";

document.getElementById("login").addEventListener("submit", async function(e) {
  e.preventDefault();

  const message = document.getElementById("message");
  const button = document.getElementById("submit");
  button.disabled = true;
  message.textContent = "Signing in...";

  try {
    const response = await fetch(
      SUPABASE_URL + "/functions/v1/student-login",
      {
        method: "POST",
        headers: {
          "apikey": SUPABASE_KEY,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          student_code: document.getElementById("student_code").value.trim(),
          password: document.getElementById("password").value
        })
      }
    );

    const data = await response.json();

    if (!response.ok || !data.access_token) {
      throw new Error(data.error || "Login failed. Please try again.");
    }

    localStorage.setItem("tibyan_access_token", data.access_token);

    if (data.refresh_token) {
      localStorage.setItem("tibyan_refresh_token", data.refresh_token);
    }

    window.location.href = "dashboard.html";

  } catch (error) {
    message.textContent = error.message || "Login failed. Please try again.";
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
