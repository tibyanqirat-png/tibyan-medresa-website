<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ቲብያን የቂርአት ማዕከል | TIBYAN QIR'AT CENTER</title>
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cloudflare.com">

<style>
:root{--purple-brand:#6A1B5E;--purple-dark:#55154B;--gold-btn:#E5A84B;--gold-btn-hover:#D79739;--gold-text:#FAD383;--navy-card:#111728;--navy-card-border:#1E293B;--bg-gold:#DFA85A}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Noto Sans Ethiopic',system-ui,-apple-system,sans-serif;color:#fff;background:var(--bg-gold);min-height:100vh;overflow-x:hidden}
.page-container{min-height:100vh;background:var(--bg-gold)}

/* Background section with your provided bookshelf image */
.top-bg{
  background-color:var(--bg-gold);
  background-image: linear-gradient(to bottom, rgba(30,15,0,.5) 0%, rgba(223,168,90,.1) 45%, rgba(223,168,90,.6) 80%, #DFA85A 100%), url('image_JISPww.png');
  background-repeat:no-repeat;
  background-position:center top;
  background-size:cover;
}

.level1-head{padding:10px 20px 0}
.level1-head .section-headline{margin-bottom:0;padding-bottom:30px}

header{height:68px;padding:0 4%;background:var(--purple-brand);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 3px 12px rgba(0,0,0,.3)}
.brand-link{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff}
.logo-container{width:56px;height:56px;flex-shrink:0;display:grid;place-items:center}

/* Logo styling with clean background removal using multiply blending */
.logo-container img, .footer-logo-box img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
  mix-blend-mode: multiply;
}

.brand-titles{display:flex;flex-direction:column}
.brand-title-am{font-size:15px;font-weight:800;color:var(--gold-text);line-height:1.2;letter-spacing:.3px}
.brand-title-en{font-size:8.5px;font-weight:700;color:var(--gold-text);letter-spacing:.8px;opacity:.95}
nav.center-nav{display:flex;align-items:center;gap:30px}
nav.center-nav a{color:#fff;text-decoration:none;font-size:13.5px;font-weight:600;transition:opacity .2s}
nav.center-nav a:hover{opacity:.8}
.header-right-controls{display:flex;align-items:center;gap:22px}
.search-btn{display:flex;align-items:center;gap:6px;color:#fff;text-decoration:none;font-size:13px;font-weight:600}
.btn-login-header{background:var(--gold-btn);color:#3B1C00;padding:7px 22px;border-radius:20px;text-decoration:none;font-weight:800;font-size:13px;display:inline-flex;align-items:center;gap:7px;box-shadow:0 2px 6px rgba(0,0,0,.18);transition:background-color .2s}
.btn-login-header:hover{background:var(--gold-btn-hover)}

.hero-section{text-align:center;padding:80px 20px 60px;max-width:900px;margin:0 auto}
.hero-title{font-size:clamp(34px,5.5vw,56px);font-weight:900;margin-bottom:14px;text-shadow:0 3px 14px rgba(0,0,0,.5)}
.hero-subtitle{font-size:clamp(14px,2.1vw,17px);font-weight:500;max-width:680px;margin:0 auto 32px;line-height:1.6;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.btn-hero-register{display:inline-flex;align-items:center;gap:10px;background:var(--gold-btn);color:#3B1C00;padding:11px 32px;border-radius:28px;text-decoration:none;font-weight:800;font-size:15px;box-shadow:0 4px 16px rgba(0,0,0,.22);transition:all .2s}
.btn-hero-register:hover{background:var(--gold-btn-hover);transform:translateY(-2px)}
.play-circle-icon{width:22px;height:22px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#DF9D41;font-size:9px;padding-left:2px}

.section-headline{text-align:center;font-size:clamp(22px,3.8vw,32px);font-weight:800;margin-bottom:35px;text-shadow:0 2px 8px rgba(0,0,0,.25)}
.levels-container{max-width:980px;margin:0 auto;padding:10px 20px 65px}
.levels-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:32px}
.level-card{background:var(--navy-card);border:1px solid var(--navy-card-border);border-radius:22px;padding:38px 28px 32px;text-align:center;display:flex;flex-direction:column;align-items:center;box-shadow:0 12px 32px rgba(0,0,0,.28)}
.card-play-button{width:48px;height:48px;background:var(--gold-btn);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--navy-card);font-size:17px;margin-bottom:20px;padding-left:3px;box-shadow:0 4px 12px rgba(229,168,75,.3)}
.level-card h3{font-size:22px;font-weight:800;margin-bottom:14px}
.level-card p{font-size:13px;line-height:1.85;color:#CBD5E1;margin-bottom:28px;max-width:320px;min-height:48px}
.btn-card-action{background:var(--gold-btn);color:#3B1C00;padding:10px 28px;border-radius:22px;font-weight:800;font-size:13px;text-decoration:none;display:inline-block;transition:background-color .2s}
.btn-card-action:hover{background:var(--gold-btn-hover)}

.carousel-section{max-width:1000px;margin:0 auto;padding:10px 20px 65px;text-align:center}
.carousel-wrapper{display:flex;align-items:center;justify-content:center;gap:20px;margin-top:0}
.carousel-arrow{width:46px;height:46px;background:#000;color:#fff;border:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;flex-shrink:0;box-shadow:0 4px 14px rgba(0,0,0,.3);transition:transform .15s}
.carousel-arrow:hover{transform:scale(1.08)}
.books-grid{display:flex;gap:22px;overflow-x:auto;scroll-behavior:smooth;scrollbar-width:none;padding:10px 5px}
.books-grid::-webkit-scrollbar{display:none}
.book-item-card{width:125px;min-height:174px;background:var(--navy-card);border:1px solid var(--navy-card-border);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:7px;padding:10px 7px 9px;flex-shrink:0;box-shadow:0 8px 22px rgba(0,0,0,.22);transition:transform .2s}
.book-item-card:hover{transform:translateY(-4px)}
.book-photo-icon{width:78px;height:96px;object-fit:contain;object-position:center;display:block;background:transparent;border:0;box-shadow:none;flex-shrink:0}
.book-name{display:block;width:100%;color:#FAD383;font-size:10px;font-weight:700;line-height:1.5;text-align:center;overflow-wrap:anywhere}

@media(max-width:768px){
.book-item-card{width:105px;min-height:158px;padding:8px 6px}
.book-photo-icon{width:68px;height:82px}
.book-name{font-size:9px}
}

.level2-container{text-align:center;padding:10px 20px 85px}
.btn-coming-purple{display:inline-flex;align-items:center;gap:10px;background:var(--purple-brand);color:#fff;padding:13px 34px;border-radius:28px;text-decoration:none;font-weight:800;font-size:15px;margin-top:15px;box-shadow:0 6px 20px rgba(0,0,0,.28);transition:all .15s}
.btn-coming-purple:hover{background:var(--purple-dark);transform:translateY(-2px)}
.floating-telegram-btn{position:fixed;right:25px;bottom:25px;width:56px;height:56px;background:#27A6E5;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 6px 18px rgba(0,0,0,.32);z-index:99;transition:transform .2s}
.floating-telegram-btn:hover{transform:scale(1.1)}
footer{background:var(--purple-brand);padding:48px 20px 32px;text-align:center;color:#fff}
.footer-logo-box{width:84px;height:84px;margin:0 auto 22px}
.social-icons-row{display:flex;justify-content:center;gap:12px;margin:22px 0}
.social-circle-link{width:34px;height:34px;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--purple-brand);text-decoration:none;font-size:17px;transition:all .2s}
.social-circle-link:hover{background:#f3e3f0;transform:translateY(-2px)}
.footer-username{font-size:15px;font-weight:700;letter-spacing:.5px}

@media(max-width:768px){
nav.center-nav{display:none}
.levels-grid{grid-template-columns:1fr;gap:24px}
.books-grid{gap:14px}
.book-item-card{width:105px;height:120px}
.carousel-arrow{width:38px;height:38px;font-size:15px}
.brand-title-am{font-size:13px}
.brand-title-en{font-size:8px}
}
</style>
</head>

<body>
<div class="page-container">

<header>
  <a href="#home" class="brand-link">
    <div class="logo-container">
      <!-- Header Logo integration -->
      <img src="image_1-JAHo.png" alt="ቲብያን የቂርአት ማዕከል">
    </div>
    <div class="brand-titles">
      <span class="brand-title-am">ቲብያን የቂርአት ማዕከል</span>
      <span class="brand-title-en">TIBYAN QIR'AT CENTER</span>
    </div>
  </a>

  <nav class="center-nav">
    <a href="#home">ዋና ገፅ</a>
    <a href="#about">ስለ እኛ</a>
  </nav>

  <div class="header-right-controls">
    <a href="#search" class="search-btn"><i class="fa-solid fa-magnifying-glass"></i><span>ፈልግ</span></a>
    <a href="#login" class="btn-login-header"><i class="fa-solid fa-key"></i><span>ግባ</span></a>
  </div>
</header>

<div class="top-bg">
  <section class="hero-section" id="home">
    <h1 class="hero-title">ቲብያን የቂርአት ማዕከል</h1>
    <p class="hero-subtitle">መሠረታዊ የሆኑ የሸሪዓ ዕውቀቶችን ካሉበት ሆነው የሚማሩበት መድረሳ</p>

  <section class="levels-container" id="levels">
    <h2 class="section-headline">የትምህርት ደረጃዎች</h2>
    <div class="levels-grid">
      <article class="level-card">
        <div class="card-play-button"><i class="fa-solid fa-play"></i></div>
        <h3>ደረጃ 1 ቂርአት</h3>
        <p>ለጀማሪዎች የሚሆኑ ዘጠኝ የዕውቀት ዘርፎችን ያካተቱ ክታቦች</p>
        <a href="register.html" class="btn-card-action">ተጨማሪ ይመልከቱ</a>
      </article>

      <article class="level-card">
        <div class="card-play-button"><i class="fa-solid fa-play"></i></div>
        <h3>ደረጃ 2 ቂርአት</h3>
        <p>ለጀማሪዎች የተሰጡ ኪታቦችን ላጠናቀቁ ተማሪዎች የሚሆኑ ከፍከፍ ያሉ ኪታቦች</p>
