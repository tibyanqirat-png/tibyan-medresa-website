<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create Password — Tibyan Medresa</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #F7F0E4;
  color: #4A2C20;
}

main {
  max-width: 480px;
  margin: 35px auto;
}

.panel {
  background: white;
  padding: 25px;
  border-radius: 16px;
  box-shadow: 0 5px 22px #00000012;
}

h1, h2 { text-align: center; }

p {
  line-height: 1.6;
  overflow-wrap: anywhere;
}

.male-theme { background: #EAF4FF; }
.female-theme { background: #FFF0F6; }

label {
  display: block;
  margin-top: 17px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 12px;
  margin-top: 7px;
  border: 1px solid #c9b89d;
  border-radius: 7px;
  font-size: 16px;
  background: white;
}

button {
  width: 100%;
  margin-top: 22px;
  padding: 14px;
  border: 0;
  border-radius: 8px;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  background: #3478B9;
}

.female-theme button { background: #C34D87; }

button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

.small {
  font-size: 13px;
  color: #65594b;
}

a { color: #765038; }
</style>
</head>

<body>
<main>
<section id="panel" class="panel">
  <h1>ቲብያን መድረሳ</h1>
  <h2>Create Your Password</h2>

  <p id="intro">Loading account verification...</p>

  <form id="passwordForm" hidden>
    <label for="studentCode">Student username</label>
    <input id="studentCode" readonly>

    <label for="password">Create password</label>
    <input id="password" type="password" minlength="8"
      autocomplete="new-password"
      placeholder="At least 8 characters" required>

    <label for="confirmPassword">Confirm password</label>
    <input id="confirmPassword" type="password" minlength="8"
      autocomplete="new-password"
      placeholder="Enter password again" required>

    <button id="saveButton" type="submit">Save Password</button>
  </form>

  <p id="message" role="status" aria-live="polite"></p>
  <p class="small">Keep your student code and password safe.</p>
  <p id="loginLink" hidden>
    <a href="login.html">Go to student login</a>
  </p>
</section>
</main>

<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  onerror="document.getElementById('intro').textContent='The account service failed to load. Check your internet connection and reload this page.'">
</script>

<script>
const intro = document.getElementById("intro");
const panel = document.getElementById("panel");
const form = document.getElementById("passwordForm");
const message = document.getElementById("message");
const saveButton = document.getElementById("saveButton");

const SUPABASE_URL =
  "https://vldyuegaoptahhlsldor.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_3NKxWzGph0mviWRGENEPYw_puAh7dxj";

if (!window.supabase) {
  intro.textContent =
    "Supabase did not load. Check your internet connection, then reload this page.";
} else {
  const supabase = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: false
      }
    }
  );

  async function initialize() {
    intro.textContent = "Checking your confirmation...";

    try {
      const params = new URLSearchParams(
        window.location.search
      );

      const hashParams = new URLSearchParams(
        window.location.hash.substring(1)
      );

      const accessToken = hashParams.get("access_token");
      const refreshToken = hashParams.get("refresh_token");
      const code = params.get("code");

      if (accessToken && refreshToken) {
        const { error } = await supabase.auth.setSession({
          access_token: accessToken,
          refresh_token: refreshToken
        });

        if (error) throw error;

        window.history.replaceState(
          {},
          document.title,
          window.location.pathname
        );
      } else if (code) {
        const { error } =
          await supabase.auth.exchangeCodeForSession(code);

        if (error) throw error;

        window.history.replaceState(
          {},
          document.title,
          window.location.pathname
        );
      }

      const { data, error } =
        await supabase.auth.getSession();

      if (error) throw error;

      if (!data.session) {
        intro.textContent =
          "No active confirmation session was found. Open your newest confirmation email and try again.";
        return;
      }

      const user = data.session.user;

      if (!user.email || !user.email_confirmed_at) {
        intro.textContent =
          "Your email is not confirmed yet. Please use the confirmation link sent to your email.";
        return;
      }

      const { data: registrations, error: lookupError } =
        await supabase
          .from("student_registrations")
          .select("student_code, gender")
          .eq("email", user.email)
          .eq("verification_status", "verified")
          .not("student_code", "is", null)
          .limit(1);

      if (lookupError) {
        console.error("Student lookup failed:", lookupError);
        intro.textContent =
          "Your email is confirmed, but student details could not be loaded. Please contact the administrator.";
        return;
      }

      if (!registrations || registrations.length === 0) {
        intro.textContent =
          "Your email is confirmed, but your student code is not available yet. Please contact the administrator.";
        return;
      }

      const student = registrations[0];

      document.getElementById("studentCode").value =
        student.student_code;

      panel.classList.add(
        String(student.gender).toLowerCase() === "female"
          ? "female-theme"
          : "male-theme"
      );

      intro.textContent =
        "Email confirmed. Create a password for your student account.";

      form.hidden = false;

    } catch (error) {
      console.error("Verification error:", error);

      intro.textContent =
        error.message ||
        "We couldn't verify this link. Please try your newest confirmation email.";
    }
  }

  form.addEventListener("submit", async function(event) {
    event.preventDefault();
    message.textContent = "";

    const password =
      document.getElementById("password").value;

    const confirmation =
      document.getElementById("confirmPassword").value;

    if (password.length < 8) {
      message.textContent =
        "Your password must contain at least 8 characters.";
      return;
    }

    if (password !== confirmation) {
      message.textContent = "The passwords do not match.";
      return;
    }

    saveButton.disabled = true;
    saveButton.textContent = "Saving...";

    try {
      const { data, error } =
        await supabase.auth.updateUser({ password });

      if (error) throw error;

      if (!data.user) {
        throw new Error(
          "Password update could not be confirmed."
        );
      }

      message.textContent =
        "Password created successfully. Your student username is " +
        document.getElementById("studentCode").value + ".";

      form.hidden = true;
      document.getElementById("loginLink").hidden = false;
      intro.textContent = "Your account password has been created.";

    } catch (error) {
      message.textContent =
        error.message ||
        "Couldn't save the password. Please try again.";

    } finally {
      saveButton.disabled = false;
      saveButton.textContent = "Save Password";
    }
  });

  initialize();
}
</script>
</body>
</html>
